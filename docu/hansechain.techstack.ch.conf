#listen 443 ssl;
#http2 on;

server {

    server_name  hansechain.techstack.ch;

    location / {
        proxy_pass       http://hansechain:9000;
        proxy_http_version         1.1;
        proxy_read_timeout 300;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-PORT $remote_port;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/techstack.ch/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/techstack.ch/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    http2 on;
}


server {
    if ($host = hansechain.techstack.ch) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name  hansechain.techstack.ch;
    return 404; # managed by Certbot
}
